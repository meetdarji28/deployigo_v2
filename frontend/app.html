<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workspace | Deployigo</title><link rel="stylesheet" href="/frontend/styles.css"></head><body><main class="shell"><nav><a class="brand" href="/app/">deployigo<span>.</span></a><div><a class="nav-btn" href="/">🏠 Home</a><span id="user"></span><button class="button ghost" id="logout">Log out</button></div></nav><div class="app-layout"><aside class="sidebar"><div class="sidebar-section"><p class="sidebar-title">Workspace</p><div class="sidebar-menu"><button class="sidebar-link active" data-tab="overview"><span>📊 Overview</span></button><button class="sidebar-link" data-tab="projects"><span>🚀 Projects</span><span class="sidebar-badge" id="sidebar-proj-count">0</span></button><button class="sidebar-link" data-tab="create"><span>➕ New Project</span></button></div></div></aside><section class="main-content"><section id="overview-container"><div class="dashboard-header" id="dashboard-header"><div><p class="eyebrow">Control Plane</p><h1 id="hello">Mitkumar's Workspace</h1></div><div class="view-tabs"><button class="tab-btn active" id="tab-btn-projects" data-tab="projects">Projects</button><button class="tab-btn" id="tab-btn-create" data-tab="create">+ Create Project</button></div></div><div class="stats" id="stats-overview"><article><b id="stat-total">0</b><span>Total Projects</span></article><article><b id="stat-active">0</b><span>Active Runtimes</span></article><article><b id="stat-php">8.5</b><span>Default Engine</span></article><article><b id="stat-env">Staging</b><span>Environment</span></article></div></section><div class="panel" id="create-panel" hidden><h2>Create project</h2><p class="muted">Provision a new project runtime environment.</p><form id="project"><label>Project name<input name="name" pattern="[a-z0-9-]+" placeholder="storefront" required></label><fieldset><legend>Source</legend><label><input type="radio" name="sourceType" value="zip" checked> Upload ZIP</label><label><input type="radio" name="sourceType" value="github"> Public GitHub repository</label></fieldset><label id="zip-source">ZIP file<input name="source" type="file" accept=".zip"></label><label id="github-source" hidden>Public GitHub URL<input name="repoUrl" type="url" placeholder="https://github.com/user/project"></label><button class="button">Create project</button><p id="message"></p></form></div><section id="projects-section"><h2>Existing Projects</h2><div id="projects" class="project-list"></div></section></section></div></main><div id="editor" class="modal" hidden><div class="modal-card"><div class="modal-head"><div><p class="eyebrow">Project settings</p><h2>Edit project</h2></div><button class="icon-button" id="close-editor" type="button" aria-label="Close">×</button></div><form id="edit-project"><input type="hidden" name="id"><label>Project name<input name="name" pattern="[a-z0-9-]+" required></label><label>PHP version<select name="phpVersion"><option value="8.5">PHP 8.5 (latest)</option><option value="8.4">PHP 8.4</option><option value="8.3">PHP 8.3</option><option value="8.2">PHP 8.2</option><option value="8.1">PHP 8.1</option></select></label><fieldset><legend>Replace source</legend><label><input type="radio" name="editSourceType" value="keep" checked> Keep current source</label><label><input type="radio" name="editSourceType" value="github"> Change public GitHub URL</label></fieldset><label id="edit-github-source" hidden>Public GitHub URL<input name="repoUrl" type="url" placeholder="https://github.com/user/project"></label><div class="modal-actions"><button class="button ghost" id="cancel-editor" type="button">Cancel</button><button class="button" type="submit">Save changes</button></div><p id="edit-message"></p></form></div></div><script src="/frontend/app.js"></script></body></html>
