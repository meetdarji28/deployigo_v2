<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Log in | Deployigo</title>
  <link rel="stylesheet" href="/frontend/styles.css">
</head>
<body>
  <main class="shell auth">
    <div class="auth-header">
      <a class="brand" href="/">deployigo<span>.</span></a>
    </div>
    <div class="auth-card">
      <section class="auth-box">
        <p class="eyebrow">Welcome back</p>
        <h1>Log in to your workspace</h1>
        <form id="login">
          <label>
            Email address
            <input name="email" type="email" placeholder="you@company.com" required autocomplete="email">
          </label>
          <label>
            Password
            <input name="password" type="password" placeholder="••••••••" required autocomplete="current-password">
          </label>
          <button class="button" type="submit">Log in</button>
          <p id="message"></p>
        </form>
        <div class="auth-footer">
          New here? <a class="text-link" href="/signup.html">Create an account</a>
        </div>
      </section>
    </div>
  </main>
  <script src="/frontend/auth.js"></script>
</body>
</html>
