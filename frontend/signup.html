<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Create account | Deployigo</title>
  <link rel="stylesheet" href="/frontend/styles.css">
</head>
<body>
  <main class="shell auth">
    <div class="auth-header">
      <a class="brand" href="/">deployigo<span>.</span></a>
    </div>
    <div class="auth-card">
      <section class="auth-box">
        <p class="eyebrow">Start shipping</p>
        <h1>Create your workspace</h1>
        <form id="signup">
          <label>
            Full Name
            <input name="name" type="text" placeholder="Jane Doe" required autocomplete="name">
          </label>
          <label>
            Email address
            <input name="email" type="email" placeholder="you@company.com" required autocomplete="email">
          </label>
          <label>
            Password
            <input name="password" type="password" placeholder="Minimum 8 characters" minlength="8" required autocomplete="new-password">
          </label>
          <button class="button" type="submit">Create account</button>
          <p id="message"></p>
        </form>
        <div class="auth-footer">
          Already registered? <a class="text-link" href="/login.html">Log in</a>
        </div>
      </section>
    </div>
  </main>
  <script src="/frontend/auth.js"></script>
</body>
</html>
